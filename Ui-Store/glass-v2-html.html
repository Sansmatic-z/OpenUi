<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Alpenglow — Glass workspace</title>
<meta name="description" content="Alpenglow: a liquid-glass workspace demo. Landing, auth, dashboard, projects, analytics and settings in one file. All data stays in your browser.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
/* ================= TOKENS ================= */
:root{
  --ink:#241d3e; --ink-muted:#524b73; --ink-faint:#6b6488;
  --lt-text:#241d3e; --lt-muted:#524b73;
  --dk-text:#edeaff; --dk-muted:#b9b4de; --dk-faint:#8f8ab8;
  --sf-dusk:linear-gradient(165deg,rgba(32,28,72,.72),rgba(17,15,44,.62));
  --sf-dusk-edge:rgba(255,255,255,.14);
  --sf-light:linear-gradient(165deg,rgba(255,255,255,.62),rgba(255,255,255,.38) 46%,rgba(255,255,255,.5));
  --rim:linear-gradient(160deg,#fff 0%,rgba(255,255,255,.15) 18%,#9fd8ff 36%,#e6b3ff 52%,#ffe3b3 68%,rgba(255,255,255,.15) 84%,#fff 100%);
  --primary-a:#ffd08a; --primary-b:#ff9d4d; --primary-ink:#2a1503;
  --c-blue:#8fd0ff; --c-pink:#e6b3ff;
  --focus-ring:#ffd08a;
  --danger:#ff8f9e; --danger-ink:#8a1f2f; --ok:#5ad6a0; --ok-ink:#1d7a4f;
  --r-lg:24px; --r-md:14px; --r-sm:10px;
  --shadow-d:0 24px 60px rgba(6,5,26,.5);
  --font-d:"Sora",system-ui,sans-serif; --font-b:"Manrope",system-ui,sans-serif;
  --gap:20px;
}
[data-accent="glacier"]{--primary-a:#bfe3ff;--primary-b:#6fb6f2;--primary-ink:#08243c}
[data-accent="orchid"]{--primary-a:#f0d0ff;--primary-b:#cf8df2;--primary-ink:#33104d}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{font-family:var(--font-b);color:var(--dk-text);background:#0a0e2c;overflow-x:hidden;-webkit-font-smoothing:antialiased}
:focus-visible{outline:2px solid var(--focus-ring);outline-offset:2px;border-radius:6px}
.glass-light :focus-visible,.on-light :focus-visible{outline-color:#3b2fbf}
button{font:inherit;color:inherit}
.ic{width:19px;height:19px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.skip{position:fixed;left:12px;top:-48px;z-index:99;background:#171439;color:#fff;padding:10px 16px;border-radius:10px;transition:top .15s}
.skip:focus{top:12px}
/* ================= SCENE ================= */
.scene{position:fixed;inset:0;z-index:0;overflow:hidden;pointer-events:none}
.sky{position:absolute;inset:0;background:linear-gradient(#0a0e2c 0%,#232a63 30%,#5b4a94 50%,#c76b98 62%,#ff9e6b 70%,#ffd9a0 74%,#ffd9a0 100%)}
body[data-mode="night"] .sky{filter:brightness(.5) saturate(.8)}
.stars{position:absolute;inset:0 0 45% 0;animation:twinkle 5s ease-in-out infinite alternate;background-image:
 radial-gradient(1.5px 1.5px at 12% 18%,rgba(255,255,255,.9),transparent),radial-gradient(1px 1px at 28% 8%,rgba(255,255,255,.7),transparent),
 radial-gradient(1.5px 1.5px at 44% 22%,rgba(255,255,255,.8),transparent),radial-gradient(1px 1px at 61% 12%,rgba(255,255,255,.65),transparent),
 radial-gradient(1.5px 1.5px at 78% 20%,rgba(255,255,255,.8),transparent),radial-gradient(1px 1px at 90% 9%,rgba(255,255,255,.7),transparent)}
.sun{position:absolute;left:66%;top:60%;width:130px;height:130px;border-radius:50%;background:radial-gradient(circle,#fff7dc,#ffd77a 45%,rgba(255,180,90,0) 72%);filter:blur(2px);animation:sunPulse 7s ease-in-out infinite alternate}
.mist{position:absolute;left:-12%;right:-12%;top:56%;height:20%;filter:blur(14px);background:radial-gradient(60% 100% at 30% 50%,rgba(255,255,255,.26),transparent 70%),radial-gradient(50% 100% at 76% 40%,rgba(255,255,255,.2),transparent 70%);animation:mistDrift 30s ease-in-out infinite alternate}
.mountains{position:absolute;left:0;right:0;bottom:26%;height:36%;width:100%}
.pines{position:absolute;bottom:25%;height:190px;width:230px}.pines.left{left:-30px}.pines.right{right:-30px;transform:scaleX(-1)}
.lake{position:absolute;left:0;right:0;bottom:0;height:27%;background:linear-gradient(#ffd9a0,#d67e8e 30%,#4a3f86 72%,#232057)}
.lake::before{content:"";position:absolute;inset:0;background:radial-gradient(46% 90% at 70% 0,rgba(255,222,150,.8),rgba(255,160,90,.28) 42%,transparent 72%)}
.lake::after{content:"";position:absolute;inset:0;opacity:.5;background:repeating-linear-gradient(90deg,transparent 0 14px,rgba(255,255,255,.07) 14px 16px);animation:shimmer 9s linear infinite}
.scene::after{content:"";position:absolute;inset:0;box-shadow:inset 0 0 190px rgba(5,5,22,.6)}
body[data-mode="night"] .scene::after{box-shadow:inset 0 0 190px rgba(3,3,14,.85)}
#sparks{position:absolute;inset:0;width:100%;height:100%}
.shard{position:absolute;filter:drop-shadow(0 8px 14px rgba(16,12,56,.4));opacity:.7;background:linear-gradient(140deg,rgba(255,255,255,.9),rgba(160,200,255,.4) 45%,rgba(255,190,230,.35));animation:shardFloat 9s ease-in-out infinite alternate}
.s1{left:14%;top:36%;width:54px;height:74px;clip-path:polygon(50% 0,100% 38%,78% 100%,18% 88%,0 34%)}
.s2{right:13%;top:30%;width:40px;height:56px;clip-path:polygon(50% 0,100% 45%,62% 100%,0 70%);animation-delay:-3s}
.s3{left:20%;bottom:22%;width:34px;height:46px;clip-path:polygon(50% 0,100% 50%,50% 100%,0 50%);animation-delay:-5s}
.s4{right:19%;bottom:26%;width:48px;height:64px;clip-path:polygon(40% 0,100% 30%,82% 100%,10% 82%);animation-delay:-7s}
/* ================= SURFACES / CONTROLS ================= */
.gd{background:var(--sf-dusk);-webkit-backdrop-filter:blur(18px) saturate(1.4);backdrop-filter:blur(18px) saturate(1.4);border:1px solid var(--sf-dusk-edge);border-radius:var(--r-lg);box-shadow:var(--shadow-d),inset 0 1px 0 rgba(255,255,255,.12)}
.gl{background:var(--sf-light);-webkit-backdrop-filter:blur(20px) saturate(1.5);backdrop-filter:blur(20px) saturate(1.5);border:1px solid transparent;border-radius:var(--r-lg);box-shadow:var(--shadow-d),inset 0 1px 0 rgba(255,255,255,.85);color:var(--lt-text);position:relative}
.gl.rim::before{content:"";position:absolute;inset:-2px;border-radius:calc(var(--r-lg) + 2px);z-index:-1;background:var(--rim);filter:blur(1px);opacity:.85}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:9px;height:46px;padding:0 20px;border:0;border-radius:13px;cursor:pointer;font:700 14.5px var(--font-b);transition:transform .12s,box-shadow .12s,background .12s;text-decoration:none}
.btn:active{transform:translateY(1px)}
.btn-p{color:var(--primary-ink);background:linear-gradient(180deg,var(--primary-a),var(--primary-b));box-shadow:0 10px 26px rgba(255,150,70,.35),inset 0 1px 0 rgba(255,255,255,.75)}
.btn-p:hover{transform:translateY(-1px)}
.btn-p:disabled{opacity:.6;cursor:not-allowed;transform:none}
.btn-g{background:rgba(255,255,255,.1);border:1px solid var(--sf-dusk-edge);color:var(--dk-text)}
.btn-g:hover{background:rgba(255,255,255,.18)}
.btn-q{background:rgba(255,255,255,.5);border:1px solid rgba(255,255,255,.7);color:var(--lt-text)}
.btn-q:hover{background:rgba(255,255,255,.72)}
.btn-d{background:rgba(255,90,110,.14);border:1px solid rgba(255,120,140,.4);color:var(--danger)}
.btn-d:hover{background:rgba(255,90,110,.24)}
.btn-lg{height:54px;padding:0 26px;font-size:16px;font-family:var(--font-d);border-radius:16px}
.linklike{border:0;background:none;cursor:pointer;color:var(--c-blue);text-decoration:underline;text-underline-offset:3px;font:600 13.5px var(--font-b);padding:4px 2px}
.chip{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:999px;font:700 11.5px var(--font-b);letter-spacing:.04em}
.chip.active{background:rgba(90,214,160,.16);color:var(--ok);border:1px solid rgba(90,214,160,.4)}
.chip.paused{background:rgba(255,208,138,.14);color:var(--primary-a);border:1px solid rgba(255,208,138,.4)}
.chip.done{background:rgba(143,208,255,.14);color:var(--c-blue);border:1px solid rgba(143,208,255,.4)}
.chip.sample{background:rgba(230,179,255,.12);color:var(--c-pink);border:1px solid rgba(230,179,255,.35)}
/* fields (dark + light) */
.field{position:relative}
.field input,.field select{width:100%;height:50px;padding:0 16px;border-radius:var(--r-md);font:500 15px var(--font-b);color:var(--dk-text);background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.22);transition:border-color .15s,box-shadow .15s}
.field input::placeholder{color:var(--dk-faint)}
.field input:focus,.field select:focus{outline:none;border-color:var(--primary-a);box-shadow:0 0 0 3px rgba(255,208,138,.22)}
.field label{position:absolute;left:14px;top:50%;translate:0 -50%;color:var(--dk-muted);pointer-events:none;transition:all .16s}
.field input:focus~label,.field input:not(:placeholder-shown)~label{top:0;left:10px;font-size:10.5px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;background:#241f52;padding:2px 7px;border-radius:6px}
.on-light .field input{color:var(--lt-text);background:rgba(255,255,255,.52);border-color:rgba(255,255,255,.75);box-shadow:inset 0 1px 0 rgba(255,255,255,.8)}
.on-light .field input:focus{border-color:#3b2fbf;box-shadow:0 0 0 3px rgba(59,47,191,.2)}
.on-light .field label{color:var(--lt-muted)}
.on-light .field input:focus~label,.on-light .field input:not(:placeholder-shown)~label{background:rgba(255,255,255,.95)}
.on-light .field .icon{stroke:var(--lt-muted)}
.field .icon{position:absolute;left:14px;top:50%;translate:0 -50%;stroke:var(--dk-muted);pointer-events:none}
.field.has-icon input{padding-left:44px}
.field.has-icon label{left:44px}
.field.has-icon input:focus~label,.field.has-icon input:not(:placeholder-shown)~label{left:34px}
.field.invalid input{border-color:var(--danger)}
.err{display:flex;gap:6px;align-items:flex-start;margin-top:6px;font-size:13px;font-weight:600;color:var(--danger)}
.on-light .err{color:var(--danger-ink)}
.err .ic{width:15px;height:15px;margin-top:1px}
/* switch */
.sw{position:relative;display:inline-block;width:44px;height:25px;flex:none}
.sw input{position:absolute;opacity:0;width:100%;height:100%;margin:0;cursor:pointer}
.sw i{position:absolute;inset:0;border-radius:999px;background:rgba(255,255,255,.16);border:1px solid var(--sf-dusk-edge);transition:background .15s}
.sw i::after{content:"";position:absolute;top:2px;left:2px;width:19px;height:19px;border-radius:50%;background:#cfc9ef;transition:transform .15s}
.sw input:checked+i{background:linear-gradient(180deg,var(--primary-a),var(--primary-b))}
.sw input:checked+i::after{transform:translateX(19px);background:var(--primary-ink)}
.sw input:focus-visible+i{outline:2px solid var(--focus-ring);outline-offset:2px}
/* ================= MARKETING ================= */
.mnav{position:sticky;top:12px;z-index:20;display:flex;align-items:center;gap:18px;margin:12px auto 0;padding:10px 16px;width:min(1120px,calc(100% - 28px));border-radius:18px}
.brand{display:flex;align-items:center;gap:10px;font:700 17px var(--font-d);color:#fff;text-decoration:none}
.brand .ic{width:26px;height:26px;stroke:url(#lg1)}
.mnav .links{display:flex;gap:4px;margin-left:auto}
.mnav .links a{color:var(--dk-muted);text-decoration:none;font:600 14px var(--font-b);padding:9px 12px;border-radius:10px}
.mnav .links a:hover{color:#fff;background:rgba(255,255,255,.1)}
.mnav .cta{display:flex;gap:10px;align-items:center}
.nav-burger{display:none;margin-left:auto}
.msheet{position:fixed;inset:0;z-index:40;background:rgba(8,7,26,.6);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);display:none}
body.menu-open .msheet{display:block}
.msheet .panel{position:absolute;right:12px;top:12px;width:min(300px,calc(100vw - 24px));padding:16px;display:grid;gap:6px}
.msheet a,.msheet button{display:block;text-align:left;color:var(--dk-text);text-decoration:none;font:600 15px var(--font-b);padding:12px 14px;border-radius:12px;background:none;border:0;cursor:pointer}
.msheet a:hover,.msheet button:hover{background:rgba(255,255,255,.1)}
.wrap{position:relative;z-index:1;width:min(1120px,calc(100% - 28px));margin:0 auto}
/* hero */
.hero{display:grid;grid-template-columns:1.05fr .95fr;gap:48px;align-items:center;padding:72px 0 56px}
.eyebrow{display:inline-flex;align-items:center;gap:10px;font:700 11px var(--font-b);letter-spacing:.26em;text-transform:uppercase;color:rgba(255,255,255,.85)}
.eyebrow::before,.eyebrow::after{content:"";width:30px;height:1px;background:rgba(255,255,255,.5)}
.hero h1{font:700 clamp(38px,5.4vw,62px)/1.05 var(--font-d);letter-spacing:-.02em;color:#fff;margin:16px 0 14px;text-shadow:0 2px 26px rgba(255,170,110,.4)}
.hero p.sub{font-size:17px;line-height:1.6;color:var(--dk-muted);max-width:46ch}
.hero .cta{display:flex;gap:12px;flex-wrap:wrap;margin:26px 0 12px}
.hero .note{font-size:12.5px;color:var(--dk-faint)}
.hero-demo{padding:26px;transform-style:preserve-3d;perspective:1000px}
.orb{width:110px;height:110px;margin:2px auto 16px;border-radius:50%;background:radial-gradient(circle at 32% 28%,rgba(255,255,255,.95),rgba(190,220,255,.5) 34%,rgba(150,140,230,.35) 62%,rgba(120,110,220,.15));box-shadow:inset 0 -14px 26px rgba(120,90,220,.35),inset 0 10px 18px rgba(255,255,255,.7),0 18px 40px rgba(30,20,90,.4);animation:slabFloat 7s ease-in-out infinite}
.hd-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:14px}
.hd-stat{padding:12px 10px;border-radius:12px;background:rgba(255,255,255,.1);border:1px solid var(--sf-dusk-edge);text-align:center}
.hd-stat b{display:block;font:700 19px var(--font-d);color:#fff}
.hd-stat span{font-size:11px;color:var(--dk-muted);letter-spacing:.06em;text-transform:uppercase}
/* sections */
.sec{padding:56px 0}
.sec-head{max-width:60ch;margin-bottom:30px}
.sec-head h2{font:700 clamp(26px,3.4vw,38px)/1.15 var(--font-d);color:#fff;letter-spacing:-.01em;margin:10px 0 10px}
.sec-head p{color:var(--dk-muted);font-size:15.5px;line-height:1.6}
.kicker{font:800 11px var(--font-b);letter-spacing:.24em;text-transform:uppercase;color:var(--primary-a)}
/* bento */
.bento{display:grid;grid-template-columns:repeat(6,1fr);gap:16px}
.bento .gd{padding:24px}
.b-a{grid-column:span 3;grid-row:span 2}
.b-b{grid-column:span 3}
.b-c{grid-column:span 3}
.b-d{grid-column:span 2}
.b-e{grid-column:span 2}
.b-f{grid-column:span 2}
.bento h3{font:700 18px var(--font-d);color:#fff;margin:12px 0 8px}
.bento p{font-size:14px;line-height:1.6;color:var(--dk-muted)}
.b-ic{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;background:rgba(255,255,255,.1);border:1px solid var(--sf-dusk-edge)}
.b-ic .ic{width:20px;height:20px;stroke:var(--primary-a)}
.mini-chart{display:flex;align-items:flex-end;gap:8px;height:96px;margin-top:18px}
.mini-chart i{flex:1;border-radius:6px 6px 3px 3px;background:linear-gradient(180deg,var(--primary-a),rgba(255,157,77,.25));opacity:.85}
.mini-chart i:nth-child(2){background:linear-gradient(180deg,var(--c-blue),rgba(143,208,255,.2))}
.mini-chart i:nth-child(4){background:linear-gradient(180deg,var(--c-pink),rgba(230,179,255,.2))}
.kbd{display:inline-block;padding:2px 8px;border-radius:6px;background:rgba(255,255,255,.12);border:1px solid var(--sf-dusk-edge);font:600 12px ui-monospace,monospace;color:var(--dk-text)}
/* steps */
.steps{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;counter-reset:st}
.step{padding:24px;position:relative}
.step b.n{display:grid;place-items:center;width:38px;height:38px;border-radius:50%;font:700 16px var(--font-d);color:var(--primary-ink);background:linear-gradient(180deg,var(--primary-a),var(--primary-b))}
.step h3{font:700 17px var(--font-d);color:#fff;margin:14px 0 8px}
.step p{font-size:14px;line-height:1.6;color:var(--dk-muted)}
/* pricing */
.plans{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;align-items:stretch}
.plan{padding:26px;display:flex;flex-direction:column;gap:14px}
.plan h3{font:700 18px var(--font-d);color:#fff}
.plan .price{font:700 38px var(--font-d);color:#fff}
.plan .price small{font:600 13px var(--font-b);color:var(--dk-muted)}
.plan ul{list-style:none;display:grid;gap:9px;font-size:14px;color:var(--dk-muted)}
.plan ul li{display:flex;gap:9px;align-items:flex-start}
.plan ul .ic{width:16px;height:16px;stroke:var(--ok);margin-top:2px}
.plan .btn{margin-top:auto}
.plan.featured{color:var(--lt-text)}
.plan.featured h3,.plan.featured .price{color:var(--lt-text)}
.plan.featured .price small,.plan.featured ul{color:var(--lt-muted)}
.plan.featured ul .ic{stroke:var(--ok-ink)}
.plan-tag{position:absolute;top:-12px;left:50%;translate:-50%;padding:4px 12px;border-radius:999px;font:800 11px var(--font-b);letter-spacing:.1em;text-transform:uppercase;color:var(--primary-ink);background:linear-gradient(180deg,var(--primary-a),var(--primary-b))}
.pay-toggle{display:flex;align-items:center;gap:12px;justify-content:center;margin-bottom:22px;font:600 14px var(--font-b);color:var(--dk-muted)}
.pay-toggle b{color:#fff}
/* faq */
.faq{display:grid;gap:10px;max-width:760px;margin:0 auto}
details.faq-i{padding:0;overflow:hidden}
details.faq-i summary{list-style:none;cursor:pointer;display:flex;align-items:center;gap:12px;padding:18px 20px;font:700 15.5px var(--font-b);color:#fff}
details.faq-i summary::-webkit-details-marker{display:none}
details.faq-i summary .ic{margin-left:auto;stroke:var(--dk-muted);transition:transform .18s}
details.faq-i[open] summary .ic{transform:rotate(180deg)}
details.faq-i p{padding:0 20px 18px;font-size:14.5px;line-height:1.65;color:var(--dk-muted)}
/* cta + footer */
.cta-band{padding:36px;text-align:center;display:grid;gap:16px;justify-items:center}
.cta-band h2{font:700 clamp(24px,3vw,32px) var(--font-d);color:#fff}
.cta-band p{color:var(--dk-muted);max-width:52ch}
footer{position:relative;z-index:1;border-top:1px solid rgba(255,255,255,.12);margin-top:40px;padding:36px 0 30px;background:rgba(8,7,26,.5);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px)}
.f-grid{display:grid;grid-template-columns:2fr 1fr 1fr;gap:28px}
.f-grid h4{font:800 12px var(--font-b);letter-spacing:.18em;text-transform:uppercase;color:var(--dk-faint);margin-bottom:12px}
.f-grid a,.f-grid button{display:block;color:var(--dk-muted);text-decoration:none;font:600 14px var(--font-b);padding:5px 0;background:none;border:0;cursor:pointer;text-align:left}
.f-grid a:hover,.f-grid button:hover{color:#fff}
.f-note{margin-top:26px;padding-top:18px;border-top:1px solid rgba(255,255,255,.1);font-size:12.5px;color:var(--dk-faint);display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}
/* ================= AUTH ================= */
.auth{min-height:100svh;display:grid;place-items:center;padding:40px 18px;position:relative;z-index:1}
.slab{width:min(410px,100%);padding:32px 28px 26px}
.screw{position:absolute;width:13px;height:13px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff,#cfd6e6 40%,#8b93a8 72%,#5a6178);box-shadow:inset 0 -1px 2px rgba(0,0,0,.45),0 1px 2px rgba(255,255,255,.7)}
.screw::after{content:"";position:absolute;left:2px;right:2px;top:50%;height:1.5px;margin-top:-.75px;background:rgba(40,44,60,.65);transform:rotate(45deg)}
.screw.tl{top:11px;left:11px}.screw.tr{top:11px;right:11px}.screw.bl{bottom:11px;left:11px}.screw.br{bottom:11px;right:11px}
.medal{width:74px;height:74px;margin:0 auto 18px;border-radius:50%;display:grid;place-items:center;background:linear-gradient(160deg,rgba(255,255,255,.85),rgba(255,255,255,.45));box-shadow:inset 0 1px 0 rgba(255,255,255,.9),0 8px 18px rgba(20,16,60,.28);position:relative}
.medal::before{content:"";position:absolute;inset:-3px;border-radius:50%;background:conic-gradient(#9fd8ff,#e6b3ff,#ffe3b3,#9fd8ff);opacity:.8;filter:blur(2px);z-index:-1}
.medal .ic{width:32px;height:32px;stroke:var(--lt-muted)}
.auth h1{font:700 24px var(--font-d);text-align:center;color:var(--lt-text)}
.auth .sub2{text-align:center;font-size:13.5px;color:var(--lt-muted);margin:6px 0 20px}
.auth form{display:grid;gap:14px}
.auth .row{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.auth .row label{display:flex;gap:8px;align-items:center;font:600 13.5px var(--font-b);color:var(--lt-muted)}
.auth .row input[type=checkbox]{width:17px;height:17px;accent-color:#3b2fbf}
.auth .swap{text-align:center;font-size:13.5px;color:var(--lt-muted);margin-top:14px}
.auth .swap a{color:#3b2fbf;font-weight:700}
.auth .fineprint{margin-top:12px;text-align:center;font-size:11.5px;color:var(--ink-faint)}
.toggle-pass{position:absolute;right:8px;top:50%;translate:0 -50%;width:36px;height:36px;border:0;border-radius:10px;background:none;cursor:pointer;display:grid;place-items:center}
.toggle-pass:hover{background:rgba(255,255,255,.5)}
.toggle-pass .ic{stroke:var(--lt-muted)}
.shake{animation:shake .4s ease}
/* ================= APP SHELL ================= */
.app{position:relative;z-index:1;display:grid;grid-template-columns:250px 1fr;min-height:100svh;gap:16px;padding:16px;width:min(1400px,100%);margin:0 auto}
.sidebar{padding:16px 12px;display:flex;flex-direction:column;gap:4px;border-radius:20px;align-self:start;position:sticky;top:16px;height:calc(100svh - 32px)}
.sidebar .brand{padding:6px 10px 14px}
.snav a{display:flex;align-items:center;gap:11px;padding:11px 12px;border-radius:12px;color:var(--dk-muted);text-decoration:none;font:600 14.5px var(--font-b)}
.snav a:hover{background:rgba(255,255,255,.08);color:#fff}
.snav a[aria-current="page"]{background:rgba(255,255,255,.13);color:#fff;box-shadow:inset 0 0 0 1px rgba(255,255,255,.16)}
.snav a[aria-current="page"] .ic{stroke:var(--primary-a)}
.sidebar .sp{flex:1}
.uchip{display:flex;align-items:center;gap:10px;padding:10px;border-radius:14px;background:rgba(255,255,255,.07);border:1px solid var(--sf-dusk-edge);cursor:pointer;width:100%;text-align:left}
.uchip:hover{background:rgba(255,255,255,.13)}
.avatar{width:34px;height:34px;flex:none;border-radius:50%;display:grid;place-items:center;font:800 13px var(--font-b);color:var(--primary-ink);background:linear-gradient(180deg,var(--primary-a),var(--primary-b))}
.uchip b{display:block;font:700 13.5px var(--font-b);color:#fff}
.uchip span{font-size:11.5px;color:var(--dk-faint)}
.topbar{display:flex;align-items:center;gap:12px;padding:10px 14px;border-radius:18px;position:sticky;top:16px;z-index:15}
.topbar h1{font:700 18px var(--font-d);color:#fff;margin-right:auto;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tsearch{position:relative;width:min(280px,32vw)}
.tsearch input{height:40px;width:100%;padding:0 12px 0 38px;border-radius:11px;background:rgba(255,255,255,.08);border:1px solid var(--sf-dusk-edge);color:var(--dk-text);font:500 14px var(--font-b)}
.tsearch input:focus{outline:none;border-color:var(--primary-a)}
.tsearch .ic{position:absolute;left:11px;top:50%;translate:0 -50%;stroke:var(--dk-faint);width:17px;height:17px}
.iconbtn{position:relative;width:40px;height:40px;flex:none;display:grid;place-items:center;border-radius:11px;border:1px solid var(--sf-dusk-edge);background:rgba(255,255,255,.07);cursor:pointer;color:var(--dk-muted)}
.iconbtn:hover{background:rgba(255,255,255,.14);color:#fff}
.badge{position:absolute;top:-5px;right:-5px;min-width:18px;height:18px;padding:0 4px;border-radius:999px;display:grid;place-items:center;font:800 10.5px var(--font-b);color:var(--primary-ink);background:linear-gradient(180deg,var(--primary-a),var(--primary-b))}
.burger{display:none}
.pop{position:absolute;right:0;top:calc(100% + 8px);width:min(330px,calc(100vw - 32px));padding:14px;z-index:30;display:none}
.pop.open{display:block}
.pop h3{font:700 14px var(--font-b);color:#fff;display:flex;align-items:center;margin-bottom:10px}
.pop h3 button{margin-left:auto}
.notif{display:flex;gap:10px;padding:10px;border-radius:12px;font-size:13.5px;color:var(--dk-muted)}
.notif.unread{background:rgba(255,255,255,.08);color:var(--dk-text)}
.notif .dot{width:8px;height:8px;flex:none;margin-top:5px;border-radius:50%;background:var(--primary-a)}
.notif.read .dot{background:transparent;box-shadow:inset 0 0 0 1px var(--dk-faint)}
.notif time{display:block;font-size:11px;color:var(--dk-faint);margin-top:3px}
.page{padding:4px 2px 30px;display:grid;gap:16px;align-content:start}
.panels{display:grid;gap:16px}
.panel{padding:20px;border-radius:20px}
.panel h2{font:700 15.5px var(--font-d);color:#fff;display:flex;align-items:center;gap:10px;margin-bottom:14px}
.panel h2 .chip{margin-left:auto}
.muted{color:var(--dk-muted);font-size:13.5px}
/* dashboard */
.dash{grid-template-columns:1.55fr 1fr}
.dash .col{display:grid;gap:16px;align-content:start}
.task-add{display:flex;gap:10px;margin-bottom:12px}
.task-add input{flex:1;height:44px;padding:0 14px;border-radius:12px;background:rgba(255,255,255,.08);border:1px solid var(--sf-dusk-edge);color:var(--dk-text);font:500 14.5px var(--font-b)}
.task-add input:focus{outline:none;border-color:var(--primary-a)}
.tasks{list-style:none;display:grid;gap:8px}
.tasks li{display:flex;align-items:center;gap:11px;padding:11px 12px;border-radius:12px;background:rgba(255,255,255,.06);border:1px solid transparent}
.tasks li:hover{border-color:var(--sf-dusk-edge)}
.tasks input[type=checkbox]{width:18px;height:18px;accent-color:var(--primary-b);cursor:pointer;flex:none}
.tasks .t{flex:1;font-size:14.5px;color:var(--dk-text)}
.tasks li.done .t{text-decoration:line-through;color:var(--dk-faint)}
.tasks .due{font-size:11.5px;color:var(--dk-faint)}
.tasks .del{width:30px;height:30px;border:0;border-radius:8px;background:none;cursor:pointer;color:var(--dk-faint);display:grid;place-items:center}
.tasks .del:hover{color:var(--danger);background:rgba(255,90,110,.12)}
.empty{padding:26px 16px;text-align:center;color:var(--dk-faint);font-size:13.5px;display:grid;gap:8px;justify-items:center}
.statrow{display:flex;align-items:baseline;gap:10px;padding:12px 2px;border-bottom:1px solid rgba(255,255,255,.09)}
.statrow:last-child{border:0;padding-bottom:2px}
.statrow b{font:700 24px var(--font-d);color:#fff}
.statrow .lbl{font-size:13px;color:var(--dk-muted);flex:1}
.delta{font:700 12px var(--font-b);padding:3px 8px;border-radius:999px}
.delta.up{color:var(--ok);background:rgba(90,214,160,.14)}
.delta.dn{color:var(--danger);background:rgba(255,90,110,.14)}
.feed{list-style:none;display:grid;gap:12px;font-size:13.5px;color:var(--dk-muted)}
.feed li{display:flex;gap:10px}
.feed .ic{width:16px;height:16px;margin-top:2px;stroke:var(--c-blue)}
.chart-wrap{position:relative}
.chart-wrap svg{width:100%;height:auto;display:block}
.readout{font:600 12.5px var(--font-b);color:var(--dk-muted);min-height:18px}
.bar{fill:url(#gb);rx:5;transition:opacity .12s}
.bar:hover{opacity:.75}
/* projects table */
.toolbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:14px}
.toolbar select{height:40px;padding:0 12px;border-radius:11px;background:rgba(255,255,255,.08);border:1px solid var(--sf-dusk-edge);color:var(--dk-text);font:600 13.5px var(--font-b)}
.toolbar .count{margin-left:auto;font-size:12.5px;color:var(--dk-faint)}
.twrap{overflow-x:auto;border-radius:14px;border:1px solid var(--sf-dusk-edge)}
table{width:100%;border-collapse:collapse;min-width:640px}
th,td{padding:12px 14px;text-align:left;font-size:14px}
th{font:800 11px var(--font-b);letter-spacing:.12em;text-transform:uppercase;color:var(--dk-faint);border-bottom:1px solid var(--sf-dusk-edge);white-space:nowrap}
th button{background:none;border:0;cursor:pointer;font:inherit;color:inherit;display:inline-flex;gap:6px;align-items:center;padding:2px}
th button:hover{color:#fff}
td{border-bottom:1px solid rgba(255,255,255,.07);color:var(--dk-muted)}
tbody tr{cursor:pointer}
tbody tr:hover{background:rgba(255,255,255,.06)}
tbody tr:last-child td{border-bottom:0}
td.name{color:#fff;font-weight:700}
.prog{width:110px;height:6px;border-radius:99px;background:rgba(255,255,255,.12);overflow:hidden}
.prog i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,var(--primary-a),var(--primary-b))}
body.dense td,body.dense th{padding:8px 12px;font-size:13px}
.bulkbar{display:flex;gap:10px;align-items:center;padding:10px 14px;border-radius:14px;background:rgba(255,208,138,.12);border:1px solid rgba(255,208,138,.4);font:600 13.5px var(--font-b);color:var(--primary-a)}
.skel{height:16px;border-radius:6px;background:linear-gradient(90deg,rgba(255,255,255,.07),rgba(255,255,255,.16),rgba(255,255,255,.07));background-size:200% 100%;animation:sk 1.1s linear infinite}
@keyframes sk{to{background-position:-200% 0}}
/* analytics */
.tabs{display:inline-flex;gap:4px;padding:4px;border-radius:12px;background:rgba(255,255,255,.07);border:1px solid var(--sf-dusk-edge)}
.tabs button{border:0;background:none;cursor:pointer;padding:8px 14px;border-radius:9px;font:700 13px var(--font-b);color:var(--dk-muted)}
.tabs button[aria-selected="true"]{background:rgba(255,255,255,.15);color:#fff}
.breakdown{display:grid;gap:14px}
.bd .lbl{display:flex;justify-content:space-between;font-size:13.5px;color:var(--dk-muted);margin-bottom:6px}
.bd .lbl b{color:#fff}
.bd .prog{width:100%}
/* settings */
.set-grid{display:grid;gap:16px;max-width:720px}
.set-row{display:flex;align-items:center;gap:14px;padding:12px 0;border-bottom:1px solid rgba(255,255,255,.09)}
.set-row:last-child{border:0}
.set-row .txt{flex:1}
.set-row .txt b{display:block;font:700 14.5px var(--font-b);color:#fff}
.set-row .txt span{font-size:12.5px;color:var(--dk-faint)}
.swatches{display:flex;gap:10px}
.swatch{width:34px;height:34px;border-radius:50%;border:2px solid transparent;cursor:pointer}
.swatch[aria-pressed="true"]{border-color:#fff;box-shadow:0 0 0 3px rgba(255,255,255,.25)}
.sw-sunset{background:linear-gradient(135deg,#ffd08a,#ff9d4d)}
.sw-glacier{background:linear-gradient(135deg,#bfe3ff,#6fb6f2)}
.sw-orchid{background:linear-gradient(135deg,#f0d0ff,#cf8df2)}
/* dialogs + toasts */
dialog{border:0;border-radius:20px;padding:26px;max-width:420px;width:calc(100vw - 44px);color:var(--dk-text);background:linear-gradient(165deg,rgba(38,33,82,.92),rgba(20,17,50,.9));-webkit-backdrop-filter:blur(24px);backdrop-filter:blur(24px);box-shadow:var(--shadow-d)}
dialog::backdrop{background:rgba(6,5,20,.6);-webkit-backdrop-filter:blur(4px);backdrop-filter:blur(4px)}
dialog h2{font:700 18px var(--font-d);color:#fff;margin-bottom:8px}
dialog p{font-size:14px;color:var(--dk-muted);margin-bottom:14px;line-height:1.55}
dialog .acts{display:flex;gap:10px;justify-content:flex-end;margin-top:18px;flex-wrap:wrap}
dialog form{display:grid;gap:14px}
#toasts{position:fixed;right:16px;bottom:16px;z-index:60;display:grid;gap:10px;width:min(340px,calc(100vw - 32px))}
.toast{display:flex;gap:10px;align-items:flex-start;padding:13px 14px;border-radius:14px;background:rgba(28,24,64,.92);border:1px solid var(--sf-dusk-edge);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);box-shadow:var(--shadow-d);font-size:13.5px;color:var(--dk-text);animation:popIn .25s ease-out}
.toast .ic{margin-top:1px}
.toast.ok .ic{stroke:var(--ok)}.toast.err .ic{stroke:var(--danger)}.toast.info .ic{stroke:var(--c-blue)}
.toast button{margin-left:auto;background:none;border:0;cursor:pointer;color:var(--dk-faint);display:grid;place-items:center}
/* 404 */
.nf{min-height:100svh;display:grid;place-items:center;text-align:center;position:relative;z-index:1;padding:30px}
.nf h1{font:700 64px var(--font-d);color:#fff}
.nf p{color:var(--dk-muted);margin:10px 0 22px}
/* ================= RESPONSIVE ================= */
@media (max-width:1020px){
  .bento{grid-template-columns:repeat(2,1fr)}
  .b-a,.b-b,.b-c,.b-d,.b-e,.b-f{grid-column:span 1;grid-row:auto}
  .dash{grid-template-columns:1fr}
}
@media (max-width:960px){
  .app{grid-template-columns:1fr}
  .sidebar{position:fixed;left:12px;top:12px;bottom:12px;width:262px;z-index:45;transform:translateX(-115%);transition:transform .2s;height:auto}
  body.nav-open .sidebar{transform:none}
  .burger{display:grid}
  .scrim{position:fixed;inset:0;z-index:40;background:rgba(6,5,20,.5);display:none}
  body.nav-open .scrim{display:block}
}
@media (max-width:900px){
  .hero{grid-template-columns:1fr;gap:34px;padding-top:44px}
  .mnav .links,.mnav .cta .btn-g{display:none}
  .nav-burger{display:grid}
  .steps,.plans{grid-template-columns:1fr}
  .f-grid{grid-template-columns:1fr 1fr}
}
@media (max-width:720px){
  .shard{display:none}
  .pines{height:140px;width:170px}
  .tsearch{display:none}
  body.search-open .tsearch{display:block;position:absolute;left:12px;right:12px;top:calc(100% + 8px);width:auto;z-index:20}
  .f-grid{grid-template-columns:1fr}
  .hd-stats{grid-template-columns:repeat(3,1fr)}
}
@media (max-width:440px){
  .slab{padding:26px 18px 20px}
  .panel{padding:16px}
  .topbar .btn-p span.lbl{display:none}
}
/* ================= MOTION ================= */
@keyframes slabFloat{0%,100%{transform:translateY(0)}50%{transform:translateY(-9px)}}
@keyframes twinkle{from{opacity:.55}to{opacity:1}}
@keyframes sunPulse{from{transform:scale(1)}to{transform:scale(1.08)}}
@keyframes mistDrift{from{transform:translateX(-3%)}to{transform:translateX(3%)}}
@keyframes shimmer{from{background-position:0 0}to{background-position:280px 0}}
@keyframes shardFloat{from{transform:translateY(-8px) rotate(-4deg)}to{transform:translateY(10px) rotate(6deg)}}
@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-7px)}40%{transform:translateX(6px)}60%{transform:translateX(-4px)}80%{transform:translateX(3px)}}
@keyframes popIn{from{transform:scale(.92);opacity:0}to{transform:scale(1);opacity:1}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}html{scroll-behavior:auto}}
body.force-reduced *,body.force-reduced *::before,body.force-reduced *::after{animation:none!important;transition:none!important}
body.force-reduced html{scroll-behavior:auto}

function seriesFor(days){
  const out = []; const now = Date.now();
  for (let i = days - 1; i >= 0; i--){
    const d = new Date(now - i*864e5);
    const v = Math.round(34 + 26*Math.sin((days-i)/3.1 + days%5) + ((i*7)%13));
    out.push({date: d.toISOString().slice(5,10), v: Math.max(6, v)});
  }
  return out;
}
function barSVG(data){
  const max = Math.max(...data.map(d=>d.v)), n = data.length;
  const bw = 100/n;
  let r = "";
  data.forEach((d,i)=>{
    const h = (d.v/max)*88;
    r += `<rect class="bar" data-v="${d.v}" data-l="${d.date}" x="${(i*bw+bw*0.18).toFixed(2)}" y="${(96-h).toFixed(2)}" width="${(bw*0.64).toFixed(2)}" height="${h.toFixed(2)}" rx="4"><title>${d.date}: ${d.v} focused min</title></rect>`;
  });
  return `<svg viewBox="0 0 100 100" preserveAspectRatio="none" style="height:150px" role="img" aria-label="Bar chart of focused minutes per day">${r}</svg>`;
}
function lineSVG(data){
  const max = Math.max(...data.map(d=>d.v)), min = Math.min(...data.map(d=>d.v));
  const pts = data.map((d,i)=>[ (i/(data.length-1))*100, 92 - ((d.v-min)/(max-min||1))*80 ]);
  const path = pts.map((p,i)=>(i?"L":"M")+p[0].toFixed(2)+" "+p[1].toFixed(2)).join(" ");
  const area = path + ` L100 100 L0 100 Z`;
  return `<svg viewBox="0 0 100 100" preserveAspectRatio="none" style="height:190px" role="img" aria-label="Line chart of focused minutes per day">
    <path d="${area}" fill="url(#gl2)" opacity=".5"/><path d="${path}" fill="none" stroke="#8fd0ff" stroke-width="1.4" vector-effect="non-scaling-stroke"/>
    ${pts.filter((_,i)=>i%Math.ceil(data.length/8)===0).map(p=>`<circle cx="${p[0].toFixed(2)}" cy="${p[1].toFixed(2)}" r="1.6" fill="#edeaff"/>`).join("")}</svg>`;
}

function taskRows(tasks){

  if (!list.length) return `<li style="background:none"><div class="empty">${ic("search")}<span>${tasks.length?"No tasks match “"+esc(state.q)+"”.":"No tasks yet — add your first one above."}</span>${tasks.length&&q?`<button class="btn btn-g" data-action="clear-q">Clear search</button>`:""}</div></li>`;
  return list.map(t=>`<li class="${t.done?"done":""}" data-id="${t.id}">
    <input type="checkbox" ${t.done?"checked":""} data-action="task-toggle" aria-label="Mark “${esc(t.title)}” ${t.done?"not done":"done"}">
    <span class="t">${esc(t.title)}</span><span class="due">${esc(t.due)}</span>
    <button class="del" data-action="task-del" aria-label="Delete “${esc(t.title)}”">${ic("trash")}</button></li>`).join("");

/* =============== ROUTER =============== */
const root = $("#root");
function rerenderPage(){
  const h = location.hash;
  const map = {"#/app":pageDash, "#/app/projects":pageProjects, "#/app/analytics":pageAnalytics, "#/app/settings":pageSettings};
  const titles = {"#/app":"Dashboard", "#/app/projects":"Projects", "#/app/analytics":"Analytics", "#/app/settings":"Settings"};
  $("#page").innerHTML = map[h]();
  $("#page-title").textContent = titles[h];
  document.querySelectorAll(".snav a").forEach(a=>{
    if (a.getAttribute("href")===h) a.setAttribute("aria-current","page"); else a.removeAttribute("aria-current");
  });
  const gs = $("#global-search"); if (gs) gs.placeholder = "Search " + titles[h].toLowerCase() + "…";
}
function render(){
  const h = location.hash || "#/";
  document.body.classList.remove("nav-open","menu-open","search-open");
  closePops();
  if (h.startsWith("#/app")){
    if (!state.session){ toast("Sign in to open the workspace.", "info"); location.hash = "#/login"; return; }
    const map = {"#/app":pageDash, "#/app/projects":pageProjects, "#/app/analytics":pageAnalytics, "#/app/settings":pageSettings};
    const titles = {"#/app":"Dashboard", "#/app/projects":"Projects", "#/app/analytics":"Analytics", "#/app/settings":"Settings"};
    if (!map[h]){ root.innerHTML = view404(); return; }
    root.innerHTML = shell(map[h](), titles[h]);
    renderNotifs();
  } else if (h === "#/" || h === "#"){ root.innerHTML = viewLanding(); }
  else if (h === "#/login"){ root.innerHTML = state.session ? (location.hash="#/app", "") : authView("login"); if(!state.session) focusAuth(); }
  else if (h === "#/signup"){ root.innerHTML = authView("signup"); focusAuth(); }
  else { root.innerHTML = view404(); }
  window.scrollTo(0,0);
}
function focusAuth(){ const t = $("#auth-title"); if (t) t.focus({preventScroll:true}); }

/* =============== EVENTS =============== */
document.addEventListener("click", e => {
  const pop = e.target.closest(".pop");
  if (!pop && !e.target.closest("[data-action='notif-open']") && !e.target.closest("[data-action='user-menu']")) closePops();
  const el = e.target.closest("[data-action]");
  if (!el) return;
  const a = el.dataset.action;
  switch(a){
    case "menu-open": document.body.classList.add("menu-open"); break;
    case "menu-close": case "menu-close2": document.body.classList.remove("menu-open"); break;
    case "nav-open": document.body.classList.add("nav-open"); break;
    case "nav-close": document.body.classList.remove("nav-open"); break;
    case "search-open": document.body.classList.toggle("search-open"); const i=$("#global-search"); if(i&&document.body.classList.contains("search-open")) i.focus(); break;
    case "toggle-pass": {
      const inp = el.parentElement.querySelector("input");
      const show = inp.type === "password";
      inp.type = show ? "text" : "password";
      el.setAttribute("aria-pressed", String(show));
      el.setAttribute("aria-label", show ? "Hide password" : "Show password");
      el.children[0].style.display = show ? "none" : "";
      el.children[1].style.display = show ? "" : "none";
      break;
    }
    case "forgot": $("#dlg-forgot").showModal(); break;
    case "fg-close": $("#dlg-forgot").close(); break;
    case "demo-fill": $("#a-user").value = "demo"; $("#a-pass").value = "glass123"; toast("Demo credentials filled.", "info"); break;
    case "pick-plan": state.plan = el.dataset.plan; LS.set("plan", state.plan); location.hash = "#/signup"; toast(el.dataset.plan + " plan selected — finish sign-up.", "info"); break;
    case "notif-open": { const p = $("#notif-pop"); const open = p.classList.toggle("open"); el.setAttribute("aria-expanded", String(open)); $("#user-pop").classList.remove("open"); break; }
    case "notif-read": LS.set("notifs", LS.get("notifs",[]).map(n=>({...n, read:true}))); renderNotifs(); render(); toast("All notifications marked read.", "ok"); break;
    case "user-menu": { const p = $("#user-pop"); const open = p.classList.toggle("open"); el.setAttribute("aria-expanded", String(open)); $("#notif-pop").classList.remove("open"); break; }
    case "signout": state.session = null; LS.del("session"); location.hash = "#/login"; toast("Signed out. Session cleared from this browser.", "ok"); break;
    case "task-new": $("#dlg-task").showModal(); $("#tk-name").focus(); break;
    case "tk-cancel": $("#dlg-task").close(); break;
    case "task-toggle": {
      const id = +el.closest("li").dataset.id;
      LS.set("tasks", LS.get("tasks",[]).map(t=>t.id===id?{...t,done:!t.done}:t));
      rerenderDashTasks(); break;
    }
    case "task-del": {
      const id = +el.closest("li").dataset.id;
      LS.set("tasks", LS.get("tasks",[]).filter(t=>t.id!==id));
      rerenderDashTasks(); toast("Task deleted.", "ok"); break;
    }
    case "clear-q": state.q = ""; const gs=$("#global-search"); if(gs) gs.value=""; rerenderDashTasks(); break;
    case "sort": { const k = el.dataset.key; state.sort = {key:k, dir: state.sort.key===k ? -state.sort.dir : 1}; rerenderPage(); break; }
    case "filter-status": break; /* handled on change */
    case "sel-all": { const rows = LS.get("projects",[]); state.sel = el.checked ? new Set(rows.map(r=>r.id)) : new Set(); rerenderPage(); break; }
    case "sel-row": { const id = +el.dataset.id; el.checked ? state.sel.add(id) : state.sel.delete(id); rerenderPage(); break; }
    case "bulk-clear": state.sel.clear(); rerenderPage(); break;
    case "bulk-done": LS.set("projects", LS.get("projects",[]).map(p=>state.sel.has(p.id)?{...p,status:"Done",progress:100}:p)); state.sel.clear(); rerenderPage(); toast("Selected projects marked done.", "ok"); break;
    case "bulk-del": confirmDlg("Delete the selected projects? This only affects demo data in this browser.", ()=>{ LS.set("projects", LS.get("projects",[]).filter(p=>!state.sel.has(p.id))); state.sel.clear(); rerenderPage(); toast("Projects deleted.", "ok"); }); break;
    case "clear-filters": state.status="All"; state.q=""; const g=$("#global-search"); if(g) g.value=""; rerenderPage(); break;
    case "range": state.range = +el.dataset.r; rerenderPage(); break;
    case "export-c": case "export-csv": {
      const data = seriesFor(state.range);
      const csv = "date,focused_minutes\n" + data.map(d=>d.date+","+d.v).join("\n");
      const url = URL.createObjectURL(new Blob([csv], {type:"text/csv"}));
      const link = document.createElement("a"); link.href = url; link.download = "alpenglow-focus-"+state.range+"d.csv"; link.click();
      URL.revokeObjectURL(url); toast("CSV downloaded.", "ok"); break;
    }
    case "accent": state.prefs.accent = el.dataset.a; LS.set("prefs", state.prefs); applyPrefs(); rerenderPage(); toast("Accent updated.", "ok"); break;
    case "reset-data": confirmDlg("Reset all demo data? Tasks, projects, notifications, preferences and your session will be re-seeded.", ()=>{ ["tasks","projects","notifs","prefs","session","v","plan"].forEach(LS.del); seed(); state.session=null; state.sel.clear(); applyPrefs(); location.hash="#/login"; render(); toast("Demo data reset.", "ok"); }); break;
    case "cf-cancel": $("#dlg-confirm").close(); break;
    case "cf-ok": $("#dlg-confirm").close(); if (cfCb) cfCb(); cfCb = null; break;
    case "pj-close": $("#dlg-project").close(); break;
  }
});

document.addEventListener("submit", e => {
  const f = e.target;

    const inp = p.parentElement.querySelector("input"); if (inp) inp.classList.toggle("invalid", !!msg); };
  if (f.id === "auth-form"){

    const mode = f.dataset.mode;

    const name = $("#a-name"), user = $("#a-user"), pass = $("#a-pass");
    if (mode === "signup"){
      if (!name.value.trim()){ setErr("#e-name","Enter your name."); ok=false; first=first||name; } else setErr("#e-name",null);
    }
    const u = user.value.trim();
    if (mode === "signup"){
      if (!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(u)){ setErr("#e-user","Enter a valid email address."); ok=false; first=first||user; } else setErr("#e-user",null);
    } else if (u.length < 3){ setErr("#e-user","Enter at least 3 characters."); ok=false; first=first||user; } else setErr("#e-user",null);
    if (pass.value.length < 6){ setErr("#e-pass","Password needs at least 6 characters."); ok=false; first=first||pass; } else setErr("#e-pass",null);
    if (mode === "signup" && !$("#a-terms").checked){ setErr("#e-terms","Please acknowledge the demo notice."); ok=false; first=first||$("#a-terms"); } else setErr("#e-terms",null);
    if (!ok){ f.classList.remove("shake"); void f.offsetWidth; f.classList.add("shake"); if(first) first.focus(); return; }
    const btn = $("#auth-btn"); btn.disabled = true; $("#auth-lbl").textContent = mode==="login" ? "Signing in…" : "Creating…";
    setTimeout(()=>{
      state.session = { name: mode==="signup" ? name.value.trim() : (u.includes("@") ? u.split("@")[0] : u), email: u.includes("@") ? u : u + "@local.demo" };
      if (mode === "signup") state.plan = $("#a-plan").value;
      LS.set("session", state.session); LS.set("plan", state.plan);
      location.hash = "#/app"; toast("Signed in — demo session stored locally.", "ok");
    }, 800);
  }
  if (f.id === "quick-add"){
    e.preventDefault();
    const v = $("#qa-input").value.trim();
    if (!v){ toast("Give the task a title first.", "err"); return; }
    const tasks = LS.get("tasks", []);
    tasks.unshift({id: Date.now(), title: v, done:false, due:"Today"});
    LS.set("tasks", tasks); $("#qa-input").value = ""; rerenderDashTasks();
  }
  if (f.id === "task-form"){
    e.preventDefault();
    const v = $("#tk-name").value.trim();
    if (!v){ const p=$("#tk-err"); p.hidden=false; p.querySelector("span").textContent="Enter a task title."; return; }
    const tasks = LS.get("tasks", []);
    tasks.unshift({id: Date.now(), title: v, done:false, due:"Today"});
    LS.set("tasks", tasks); f.reset(); $("#dlg-task").close();
    if (location.hash.startsWith("#/app")) { rerenderPage(); } toast("Task added.", "ok");
  }
  if (f.id === "profile-form"){
    e.preventDefault();
    let ok = true;
    const n = $("#p-name").value.trim(), em = $("#p-email").value.trim();
    if (n.length < 2){ setErr("#pe-name","Enter your name."); ok=false; } else setErr("#pe-name",null);
    if (!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(em)){ setErr("#pe-email","Enter a valid email address."); ok=false; } else setErr("#pe-email",null);
    if (!ok) return;
    state.session = {...state.session, name:n, email:em}; LS.set("session", state.session);
    render(); toast("Profile saved in this browser.", "ok");
  }
});
function rerenderDashTasks(){
  const ul = $("#task-list"); if (!ul) return;
  ul.innerHTML = taskRows(LS.get("tasks", []));
  const tasks = LS.get("tasks", []), done = tasks.filter(t=>t.done).length;
  const chip = ul.closest("section").querySelector(".chip");
  if (chip){ chip.textContent = done + "/" + tasks.length + " done"; chip.className = "chip " + (tasks.length && done===tasks.length ? "active" : "paused"); }
}
/* =============== PREFS / FX =============== */
function applyPrefs(){
  document.documentElement.dataset.accent = state.prefs.accent;
  document.body.classList.toggle("dense", state.prefs.dense);
  document.body.classList.toggle("force-reduced", state.prefs.reduced);
}
applyPrefs();
/* tilt on hero demo */
const fine = matchMedia("(pointer: fine)").matches;
const reducedMQ = matchMedia("(prefers-reduced-motion: reduce)");
if (fine){
  let tick = false, px = 0, py = 0;
  addEventListener("pointermove", e => {
    if (reducedMQ.matches || document.body.classList.contains("force-reduced")) return;
    const box = $("#tiltbox"); if (!box) return;
    px = e.clientX / innerWidth - .5; py = e.clientY / innerHeight - .5;
    if (!tick){ tick = true; requestAnimationFrame(()=>{ tick = false; box.style.transform = `rotateY(${(px*7).toFixed(2)}deg) rotateX(${(-py*6).toFixed(2)}deg)`; }); }
  });
}
/* sparks */
(function(){
  const c = $("#sparks"), ctx = c.getContext("2d");
  let W, H, parts = [], run = true, dpr = Math.min(devicePixelRatio||1, 2), last = 0;
  function spawn(init){ const warm = Math.random() > .25;
    return {x:Math.random()*W, y:init?Math.random()*H:H+8, r:.8+Math.random()*1.9, vy:.15+Math.random()*.4, ph:Math.random()*6.28, sp:.4+Math.random()*.8, c:warm?"255,190,110":"170,200,255"}; }
  function resize(){ W=c.clientWidth; H=c.clientHeight; c.width=W*dpr; c.height=H*dpr; ctx.setTransform(dpr,0,0,dpr,0,0);
    parts = Array.from({length: Math.min(60, Math.round(W*H/26000))}, ()=>spawn(true)); }
  function loop(t){ if(!run) return; requestAnimationFrame(loop); if (t-last<33) return; last=t;
    ctx.clearRect(0,0,W,H);
    for (let i=0;i<parts.length;i++){ const p=parts[i]; p.y-=p.vy; p.ph+=.02*p.sp; p.x+=Math.sin(p.ph)*.35;
      if (p.y<-10) parts[i]=p=spawn(false);
      ctx.beginPath(); ctx.fillStyle=`rgba(${p.c},${(.25+.45*(0.5+0.5*Math.sin(p.ph*2))).toFixed(2)})`;
      ctx.shadowColor=`rgba(${p.c},.8)`; ctx.shadowBlur=7; ctx.arc(p.x,p.y,p.r,0,6.2832); ctx.fill(); }
    ctx.shadowBlur=0; }
  resize(); addEventListener("resize", resize);
  document.addEventListener("visibilitychange", ()=>{ if (document.hidden) run=false; else if (!reducedMQ.matches && !document.body.classList.contains("force-reduced")){ run=true; requestAnimationFrame(loop);} });
  if (!reducedMQ.matches) requestAnimationFrame(loop);
})();
/* eye-off initially hidden */
document.addEventListener("DOMContentLoaded", ()=>{ document.querySelectorAll(".toggle-pass").forEach(b=>b.children[1].style.display="none"); });
render();
</script>
